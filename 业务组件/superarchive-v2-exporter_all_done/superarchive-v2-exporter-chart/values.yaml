exporter:
  name: superarchive-v2-exporter
  hostNetwork: true
  server:
    nodePort: 18082
    # svc端口
    service:
      annotations: {}
      type: NodePort
      port: 8082
    # pod端口
    targetPort: 8082
  brpc:
    nodePort: 18002
    # svc端口
    service:
      annotations: {}
      type: NodePort
      port: 8002
    # pod端口
    targetPort: 8002

  replicaCount: 1
  image: superarchive-v2-exporter
  imageTag: v1.0.1
  # 因为采用的是hostNetwork模式，直接访问当前物理主机的consul
  consul:
    ip: 127.0.0.1
    #ip: consul-service.default.svc.cluster.local.
    port: 8500
  mysql:

    # 采用leader的svc地址
    ip: master-service.default.svc.cluster.local.
    port: 3306

    user: root
    pass: xxxxx
    db: superarchivev2
  redis:
    #ip: 127.0.0.1
    #port: 9999
    ip: redis-master.default.svc.cluster.local.
    port: 6379
    db: 0
    pass: ""
  feature:
    #ip: 192.0.2.10
    ip: feature-service.default.svc.cluster.local. 
    port: 8815
  odp:
    #ip: 192.0.2.10
    ip: odp-service.default.svc.cluster.local. 
    port: 8400

  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 60
    failureThreshold: 8
    successThreshold: 1
  readinessProbe:
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 1
    successThreshold: 1
    failureThreshold: 3

  resources:
    requests:
      cpu: 1
      memory: 1Gi
    limits:
      cpu: 4
      memory: 4Gi
