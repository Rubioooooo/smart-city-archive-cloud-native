apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "mysql.fullname" . }}-superarchivev2-db-init
  namespace: {{ .Release.Namespace }}
data:
  superarchivev2-db-init.sql: |-
    CREATE DATABASE IF NOT EXISTS superarchivev2;
    
    use superarchivev2;
    
    SET NAMES utf8mb4;
    
    -- ----------------------------
    -- Table structure for arch_pictures
    -- ----------------------------
    CREATE TABLE IF NOT EXISTS `arch_pictures` (
      `id` bigint(20) unsigned NOT NULL AUTO_INCREMENT,
      `image_id` varchar(256) NOT NULL COMMENT '人脸imageid',
      `background_image_id` varchar(256) NOT NULL COMMENT '背景图id',
      `feature` blob NOT NULL COMMENT '人脸特征',
      `camera_id` varchar(20) NOT NULL COMMENT '摄像头id',
      `snapshot_time` bigint(20) NOT NULL COMMENT '抓拍时间',
      `car_plate` varchar(50) NOT NULL DEFAULT '' COMMENT '车牌',
      `face_score` decimal(5,2) DEFAULT NULL COMMENT '人脸质量分数',
      `face_blur` decimal(5,2) DEFAULT NULL COMMENT '人脸模糊度',
      `occlu` varchar(512) DEFAULT NULL COMMENT '人脸遮挡',
      `age_type` tinyint(2) DEFAULT NULL COMMENT '人脸年龄段',
      `main_driver` tinyint(2) NOT NULL DEFAULT '0' COMMENT '主副驾 1-主驾 2-副驾',
      `face_attr` varchar(512) DEFAULT '0' COMMENT '人脸属性,目前只有口罩，之后会有多个属性',
      `create_time` bigint(20) NOT NULL COMMENT '创建时间',
      PRIMARY KEY (`id`),
      KEY `idx_imgid` (`image_id`),
      KEY `idx_create_time` (`create_time`) USING BTREE
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8;
    
    
    -- ----------------------------
    -- Table structure for arch_suspicious_docs
    -- ----------------------------
    CREATE TABLE IF NOT EXISTS `arch_suspicious_docs` (
      `id` bigint(20) NOT NULL COMMENT 'Pk',
      `day_doc_id` bigint(20) NOT NULL COMMENT '天级库档案id',
      `history_doc` varchar(2000) NOT NULL COMMENT '历史档案 H1:score1,H2:score2',
      `state` tinyint(2) NOT NULL DEFAULT '0' COMMENT '可疑档流转状态 0-新增 10-已处理成功',
      `create_time` bigint(20) NOT NULL COMMENT '创建时间',
      `update_time` bigint(20) NOT NULL COMMENT '更新时间',
      PRIMARY KEY (`id`),
      KEY `idx_update` (`update_time`) USING BTREE
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8;
    
    
    -- ----------------------------
    -- Table structure for arch_third_party_devices
    -- ----------------------------
    CREATE TABLE IF NOT EXISTS `arch_third_party_devices` (
      `id` bigint(20) NOT NULL AUTO_INCREMENT,
      `area` varchar(255) DEFAULT NULL,
      `camera_account` varchar(255) DEFAULT NULL,
      `camera_brand` varchar(255) DEFAULT NULL,
      `camera_ip` varchar(255) DEFAULT NULL,
      `camera_name` varchar(255) DEFAULT NULL,
      `camera_password` varchar(255) DEFAULT NULL,
      `device_id` varchar(255) DEFAULT NULL,
      `height` int(11) DEFAULT NULL,
      `info` varchar(255) DEFAULT NULL,
      `output_video_url` varchar(255) DEFAULT NULL,
      `owner_id` bigint(20) DEFAULT NULL,
      `port` int(11) DEFAULT NULL,
      `rtsp_url` varchar(255) DEFAULT NULL,
      `status` varchar(20) DEFAULT NULL,
      `width` int(11) DEFAULT NULL,
      `scene_id` bigint(20) DEFAULT NULL,
      `gb_id` varchar(255) DEFAULT NULL,
      `access_type` varchar(255) DEFAULT NULL,
      `type` varchar(255) DEFAULT NULL,
      `created_by` varchar(255) DEFAULT NULL,
      `created_date` datetime DEFAULT NULL,
      `last_modified_by` varchar(255) DEFAULT NULL,
      `last_modified_date` datetime DEFAULT NULL,
      `last_sync_at` datetime DEFAULT NULL,
      `latitude` double(10,6) DEFAULT NULL,
      `manufactor_code` varchar(255) DEFAULT NULL,
      `model` varchar(255) DEFAULT NULL,
      `function_type` varchar(255) DEFAULT NULL,
      `longitude` double(10,6) DEFAULT NULL,
      PRIMARY KEY (`id`) USING BTREE
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8;
    
    
    -- ----------------------------
    -- Table structure for arch_searched_doc_info
    -- ----------------------------
    CREATE TABLE IF NOT EXISTS `arch_searched_doc_info` (
      `id` bigint(20) NOT NULL AUTO_INCREMENT,
      `create_time` bigint(20) DEFAULT NULL,
      `doc_id` bigint(20) DEFAULT NULL,
      `document` varchar(255) DEFAULT NULL,
      `encrypted_key` varchar(255) DEFAULT NULL,
      `pic_list` varchar(255) DEFAULT NULL,
      PRIMARY KEY (`id`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8;
    
    
    
    CREATE TABLE IF NOT EXISTS `arch_dict` (
      `id` bigint(20) NOT NULL AUTO_INCREMENT,
      `description` varchar(500) DEFAULT NULL,
      `dict_key` varchar(100) NOT NULL,
      `dict_value` text NOT NULL,
      PRIMARY KEY (`id`) USING BTREE,
      UNIQUE KEY `UK_6hg0fikdbrv661a9hwlrp6i3y` (`dict_key`) USING BTREE
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8 ROW_FORMAT=DYNAMIC;
    
    
