apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.web.name }}
spec:
  type: {{ .Values.web.service.type }}
  ports:
  - name: {{ .Values.web.name }}
    port: {{ .Values.web.service.port }}
    protocol: TCP
    targetPort: {{ .Values.web.targetPort }}
    {{ if eq .Values.web.service.type "NodePort" }}
    nodePort: {{ .Values.web.nodePort }}
    {{ end }}
  selector:
    app: "{{ .Values.web.name }}"
