apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ template "feature-frame.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ template "feature-frame.fullname" . }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
spec:
  serviceName: {{ template "feature-frame.fullname" . }}
  selector:
    matchLabels:
      app: "{{ template "feature-frame.fullname" . }}-ist"
  replicas: {{ default 1 .Values.Replicas }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: "{{ template "feature-frame.fullname" . }}-ist"
{{- if .Values.podLabels }}
{{- with .Values.podLabels }}
{{ toYaml . | indent 10 }}
{{- end }}
{{- end }}
{{- with .Values.podAnnotations }}
      annotations:
{{ toYaml . | indent 8 }}
{{- end }}
    spec:
      #hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- if .Values.schedulerName }}
      schedulerName: "{{ .Values.schedulerName }}"
      {{- end }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
      {{ tpl .Values.affinity . | indent 8 }}
      {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector:
      {{ toYaml .Values.nodeSelector | indent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: "{{ .Values.priorityClassName }}"
      {{- end }}
      {{- if .Values.initContainer.enabled }}
      initContainers:
      - name: "feature-frame-init"
        image: "{{ .Values.initContainer.image}}:{{ .Values.initContainer.tag }}"
        imagePullPolicy: {{ .Values.imagePullPolicy | quote }}
        resources:
{{ toYaml .Values.initContainer.resources | indent 10 }}
        command:  ["rm","-rf","aikl-face-package-1.3.5.1/log/"]
        volumeMounts:
        - name: data
          mountPath: /home/idl-face/aikl-face-package-1.3.5.1/log/
          {{- if .Values.persistence.subPath }}
          subPath: {{ .Values.persistence.subPath }}
          {{- end }}
      {{- if .Values.extraInitContainers }}
{{ tpl .Values.extraInitContainers . | indent 6 }}
      {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
      {{- end }}
     {{- end }}
      containers:
      - name: {{ template "feature-frame.fullname" . }}
        image: "{{ .Values.image }}:{{ .Values.imageTag }}"
        imagePullPolicy: {{ .Values.imagePullPolicy | quote }}

        {{- with .Values.args }}
        args:
        {{- range . }}
          - {{ . | quote }}
        {{- end }}
        {{- end }}
        resources:
{{ toYaml .Values.resources | indent 10 }}
        env:
          - name: TZ
            value: Asia/Shanghai
          - name: NVIDIA_VISIBLE_DEVICES
            value: all
          - name: NVIDIA_DRIVER_CAPABILITIES
            value: 'compute,utility'
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - "ps aux |grep face-general-service | grep -v supervise.face-general-service |grep -v grep |grep -v tail &>/dev/null"
          initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          successThreshold: {{ .Values.livenessProbe.successThreshold }}
          failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
        readinessProbe:
          tcpSocket:
            port: {{ .Values.targetport }}
          initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          successThreshold: {{ .Values.readinessProbe.successThreshold }}
          failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
        volumeMounts:
        - name: data
          mountPath: /home/idl-face/aikl-face-package-1.3.5.1/log/
          {{- if .Values.persistence.subPath }}
          subPath: {{ .Values.persistence.subPath }}
          {{- end }}
        - name: configurations
          mountPath: /home/idl-face/aikl-face-package-1.3.5.1/conf/service.conf
          subPath: service.conf
        - name: configurations
          mountPath: /home/idl-face/aikl-face-package-1.3.5.1/conf/agent_get_feature.json
          subPath: agent_get_feature.json
        - name: configurations
          mountPath: /home/idl-face/aikl-face-package-1.3.5.1/conf/ipt_map/detect.json
          subPath: detect.json

        {{- if .Values.extraVolumeMounts }}
{{ tpl .Values.extraVolumeMounts . | indent 8 }}
        {{- end }}

      volumes:
      - name: configurations
        configMap:
          name: {{ template "feature-frame.fullname" . }}-configuration

  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
        - {{ .Values.persistence.accessMode | quote }}
      resources:
        requests:
          storage: {{ .Values.persistence.size }}
      {{- if .Values.persistence.storageClass }}
      {{- if (eq "-" .Values.persistence.storageClass) }}
      storageClassName: ""
      {{- else }}
      storageClassName: "{{ .Values.persistence.storageClass }}"
      {{- end }}
      {{- end }}
  {{- end }}
