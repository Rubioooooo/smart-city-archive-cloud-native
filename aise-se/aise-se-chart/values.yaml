livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3
readinessProbe:
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 1
  successThreshold: 1
  failureThreshold: 3
persistence:
  enabled: true
  size: 10Gi
  accessMode: ReadWriteOnce
  storageClass: local-path
resources:
  # cpu配置
  requests:
    cpu: 100m
    memory: 1Gi
  limits:
    cpu: 4
    memory: 60Gi
  # gpu配置: 如果设置gpu: true，那么请注释上面6行cpu配置，打开下面4行注释
  #requests:
